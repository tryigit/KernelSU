name: PR3650 rescan format

on:
  push:
    branches:
      - test/pr3650-rescan-patchwork

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[selinux-format-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format transactional SELinux hide fix
        shell: bash
        run: |
          clang-format -i kernel/feature/selinux_hide.c
          git diff --check
          git diff -- kernel/feature/selinux_hide.c
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- kernel/feature/selinux_hide.c; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kernel/feature/selinux_hide.c
          git commit -m "style: format SELinux rollback fix [selinux-format-done]"
          git push
